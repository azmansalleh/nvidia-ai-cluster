      # Grove Health Check
      #
      # Validates the Grove pod-lifecycle controller for the Dynamo inference
      # platform. The chart deploys a single `grove-operator` Deployment in
      # the `dynamo-system` namespace. We gate on the Available condition
      # transitioning to True — mirrors the existing assertion in
      # tests/chainsaw/ai-conformance/kind-inference-dynamo/assert-dynamo.yaml
      # so this registry check produces the same readiness signal that the
      # ai-conformance suite exercises. It also asserts every CRD the chart
      # installs is Established.
      apiVersion: chainsaw.kyverno.io/v1alpha1
      kind: Test
      metadata:
        name: grove-health-check
      spec:
        timeouts:
          assert: 5m
        steps:
          - name: validate-crds-established
            # Verified against chart v0.1.0-alpha.13, which installs these six CRDs
            # from crds/. A CRD whose shortName a leftover CRD still holds, such as
            # clustertopologybindings after an upgrade from v0.1.0-alpha.8, never
            # becomes Established.
            try:
              - assert:
                  resource:
                    apiVersion: apiextensions.k8s.io/v1
                    kind: CustomResourceDefinition
                    metadata:
                      name: clustertopologybindings.grove.io
                    status:
                      (conditions[?type == 'Established']):
                        - status: "True"
              - assert:
                  resource:
                    apiVersion: apiextensions.k8s.io/v1
                    kind: CustomResourceDefinition
                    metadata:
                      name: podcliques.grove.io
                    status:
                      (conditions[?type == 'Established']):
                        - status: "True"
              - assert:
                  resource:
                    apiVersion: apiextensions.k8s.io/v1
                    kind: CustomResourceDefinition
                    metadata:
                      name: podcliquescalinggroups.grove.io
                    status:
                      (conditions[?type == 'Established']):
                        - status: "True"
              - assert:
                  resource:
                    apiVersion: apiextensions.k8s.io/v1
                    kind: CustomResourceDefinition
                    metadata:
                      name: podcliquesets.grove.io
                    status:
                      (conditions[?type == 'Established']):
                        - status: "True"
              - assert:
                  resource:
                    apiVersion: apiextensions.k8s.io/v1
                    kind: CustomResourceDefinition
                    metadata:
                      name: podgangmaps.grove.io
                    status:
                      (conditions[?type == 'Established']):
                        - status: "True"
              - assert:
                  resource:
                    apiVersion: apiextensions.k8s.io/v1
                    kind: CustomResourceDefinition
                    metadata:
                      name: podgangs.scheduler.grove.io
                    status:
                      (conditions[?type == 'Established']):
                        - status: "True"
          - name: validate-grove-operator-deployment
            try:
              - assert:
                  resource:
                    apiVersion: apps/v1
                    kind: Deployment
                    metadata:
                      name: grove-operator
                      namespace: dynamo-system
                    status:
                      (conditions[?type == 'Available']):
                        - status: "True"
          - name: validate-grove-pods-healthy
            try:
              - error:
                  resource:
                    apiVersion: v1
                    kind: Pod
                    metadata:
                      namespace: dynamo-system
                      labels:
                        app.kubernetes.io/name: grove-operator
                    status:
                      phase: Pending
              - error:
                  resource:
                    apiVersion: v1
                    kind: Pod
                    metadata:
                      namespace: dynamo-system
                      labels:
                        app.kubernetes.io/name: grove-operator
                    status:
                      phase: Failed
              # JMESPath projection (not single-element match): kyverno-json's
              # sliceNode.Assert gates on exact slice length before per-element
              # comparison, so a `containerStatuses: - state: ...` shape only
              # matches single-container pods and silently passes sidecars. Use
              # `containerStatuses[?...] | length(@) > 0` to fire on any
              # container at any index. Parallel initContainerStatuses block
              # below catches init-container failures (invisible to
              # containerStatuses). Per PR #1245 review (@ArangoGutierrez).
              - error:
                  resource:
                    apiVersion: v1
                    kind: Pod
                    metadata:
                      namespace: dynamo-system
                      labels:
                        app.kubernetes.io/name: grove-operator
                    status:
                      ((containerStatuses || `[]`)[?state.waiting.reason == 'CrashLoopBackOff' || state.waiting.reason == 'ImagePullBackOff' || state.waiting.reason == 'ErrImagePull' || state.waiting.reason == 'CreateContainerConfigError'] | length(@) > `0`): true
              - error:
                  resource:
                    apiVersion: v1
                    kind: Pod
                    metadata:
                      namespace: dynamo-system
                      labels:
                        app.kubernetes.io/name: grove-operator
                    status:
                      ((initContainerStatuses || `[]`)[?state.waiting.reason == 'CrashLoopBackOff' || state.waiting.reason == 'ImagePullBackOff' || state.waiting.reason == 'ErrImagePull' || state.waiting.reason == 'CreateContainerConfigError'] | length(@) > `0`): true
