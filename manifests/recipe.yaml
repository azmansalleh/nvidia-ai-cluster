              - assert:
                  resource:
                    apiVersion: apiextensions.k8s.io/v1
                    kind: CustomResourceDefinition
                    metadata:
                      name: podcliquesets.grove.io
                    status:
                      (conditions[?type == 'Established']):
                        - status: "True"
              - assert:
                  resource:
                    apiVersion: apiextensions.k8s.io/v1
                    kind: CustomResourceDefinition
                    metadata:
                      name: podgangmaps.grove.io
                    status:
                      (conditions[?type == 'Established']):
