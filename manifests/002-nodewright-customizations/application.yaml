apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nodewright-customizations
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  project: default
  source:
    repoURL: https://github.com/azmansalleh/nv-ai-cluster.git
    targetRevision: main
    path: manifests/002-nodewright-customizations
  destination:
    server: https://kubernetes.default.svc
    namespace: nodewright
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 8
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
