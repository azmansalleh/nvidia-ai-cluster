apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snapshot
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '9'
spec:
  project: default
  sources:
  - repoURL: ghcr.io/ai-dynamo/snapshot
    chart: snapshot
    targetRevision: 0.3.0
    helm:
      valueFiles:
      - $values/manifests/012-snapshot/values.yaml
      skipCrds: true
  - repoURL: https://github.com/azmansalleh/nvidia-ai-cluster.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: snapshot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 8
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
