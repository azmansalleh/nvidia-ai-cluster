apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grove
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  project: default
  sources:
    - repoURL: ghcr.io/ai-dynamo/grove
      chart: grove-charts
      targetRevision: v0.1.0-alpha.13
      helm:
        valueFiles:
          - $values/manifests/009-grove/values.yaml
    - repoURL: https://github.com/azmansalleh/nv-ai-cluster.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dynamo-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 8
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: grove-webhook-server-cert
      namespace: dynamo-system
      jsonPointers:
        - /data
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: podcliqueset-defaulting-webhook
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: clustertopology-validating-webhook
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: podcliqueset-validating-webhook
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
