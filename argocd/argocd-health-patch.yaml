# Merge this single key into the existing Helm-managed argocd-cm.
# Carry the same setting into Argo CD's Helm values to preserve it on upgrades.
data:
  resource.customizations.health.argoproj.io_Application: |
    local hs = {status = "Progressing", message = "Waiting for child Application"}
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        hs.message = obj.status.health.message or ""
      end
      if hs.status == "Healthy" and
         (obj.status.sync == nil or obj.status.sync.status ~= "Synced") then
        hs.status = "Progressing"
        hs.message = "Waiting for child Application to sync"
      end
    end
    return hs
