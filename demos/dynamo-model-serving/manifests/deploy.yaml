apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamo-model-serving-config
data:
  speculative-config: |-
    {
      "method": "dspark",
      "model": "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-DSpark",
      "num_speculative_tokens": 7,
      "attention_backend": "TRITON_ATTN"
    }
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: dynamo-model-serving
  labels:
    app.kubernetes.io/name: dynamo-model-serving
    app.kubernetes.io/part-of: demo
  annotations:
    demo.nv-ai-cluster.io/upstream: https://github.com/ai-dynamo/dynamo/blob/b08b769c4b0a461303039d4c09efe33b684c5c57/recipes/nemotron-3.5-lightning/vllm/agg-h200-dspark-kv-router/deploy.yaml
spec:
  backendFramework: vllm
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0-nemotron-3.5-lightning-dev.1@sha256:a5f95c0e8d0a8c116e6c8a213157ee4338fe066022f8db19b41e37a0ce0c9fe4
          imagePullPolicy: IfNotPresent
          command:
          - python3
          args:
          - -m
          - dynamo.frontend
          - --router-mode
          - kv
          - --router-kv-events
          - --kv-cache-block-size
          - '64'
          - --trust-remote-code
          env:
          - name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          - name: DYN_HTTP_BODY_LIMIT_MB
            value: '200'
          - name: HF_HOME
            value: /model-cache
          - name: HF_HUB_OFFLINE
            value: '0'
          - name: HF_MODULES_CACHE
            value: /tmp/hf_modules
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 2Gi
            limits:
              cpu: '1'
              memory: 2Gi
              ephemeral-storage: 4Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 60
            failureThreshold: 60
          volumeMounts:
          - name: shared-model-cache
            mountPath: /model-cache
        volumes:
        - name: shared-model-cache
          emptyDir:
            sizeLimit: 2Gi
    runtimeVersionOverride: 1.5.0
  - name: agg
    type: worker
    replicas: 1
    sharedMemorySize: 8Gi
    podTemplate:
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: nvidia.com/gpu.product
                  operator: In
                  values:
                  - NVIDIA-H200-NVL
        tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: 'true'
          effect: NoSchedule
        volumes:
        - name: shared-model-cache
          emptyDir:
            sizeLimit: 80Gi
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0-nemotron-3.5-lightning-dev.1@sha256:a5f95c0e8d0a8c116e6c8a213157ee4338fe066022f8db19b41e37a0ce0c9fe4
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/
          command:
          - python3
          - -m
          - dynamo.vllm
          args:
          - --model
          - nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
          - --served-model-name
          - nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
          - --trust-remote-code
          - --tensor-parallel-size
          - '1'
          - --max-num-seqs
          - '8'
          - --max-num-batched-tokens
          - '8192'
          - --enable-prefix-caching
          - --block-size
          - '64'
          - --async-scheduling
          - --mamba-backend
          - flashinfer
          - --mamba-ssm-cache-dtype
          - float16
          - --mamba-cache-mode
          - align
          - --enable-mamba-cache-stochastic-rounding
          - --mamba-cache-philox-rounds
          - '5'
          - --dyn-tool-call-parser
          - nemotron_nano
          - --dyn-reasoning-parser
          - nemotron_nano
          - --reasoning-parser
          - nemotron_v3
          - --speculative-config=$(SPECULATIVE_CONFIG)
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20080","enable_kv_cache_events":true}'
          - --disaggregation-mode
          - agg
          - --max-model-len
          - '8192'
          env:
          - name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          - name: HF_HOME
            value: /model-cache
          - name: HF_HUB_OFFLINE
            value: '0'
          - name: HF_MODULES_CACHE
            value: /tmp/hf_modules
          - name: TRITON_CACHE_DIR
            value: /tmp/.triton-cache
          - name: VLLM_CONFIG_ROOT
            value: /tmp/vllm-config
          - name: VLLM_CACHE_ROOT
            value: /tmp/vllm-cache
          - name: SPECULATIVE_CONFIG
            valueFrom:
              configMapKeyRef:
                name: dynamo-model-serving-config
                key: speculative-config
          - name: NCCL_IB_DISABLE
            value: '1'
          - name: PYTHONHASHSEED
            value: '0'
          resources:
            requests:
              cpu: '2'
              memory: 40Gi
              ephemeral-storage: 64Gi
              nvidia.com/gpu: '1'
            limits:
              cpu: '6'
              memory: 48Gi
              ephemeral-storage: 96Gi
              nvidia.com/gpu: '1'
          securityContext:
            runAsUser: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          startupProbe:
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 120
          volumeMounts:
          - name: shared-model-cache
            mountPath: /model-cache
        runtimeClassName: nvidia
    runtimeVersionOverride: 1.5.0
