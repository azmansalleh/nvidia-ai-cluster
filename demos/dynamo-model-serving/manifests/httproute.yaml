apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dynamo-model-serving
  namespace: demo-dynamo-model-serving
spec:
  parentRefs:
    - name: inference-gateway
      namespace: agentgateway-system
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: dynamo-model-serving-frontend
          port: 8000